name: Deploy to Cloudflare Workers

# 默认仅支持手动触发，避免未配置 Secrets 时每次 push 都产生失败的运行记录。
# 若希望「推送即自动部署」，取消下面 push 触发器的注释即可。
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker 名称（默认 pansou）"
        required: false
        default: "pansou"
  # push:
  #   branches: [main]

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 Secrets
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "::error title=缺少部署密钥::请在仓库 Settings → Secrets and variables → Actions 中添加 CF_API_TOKEN（Cloudflare API Token）和 CF_ACCOUNT_ID（账户 ID）。"
            exit 1
          fi

      - name: 构建产物
        run: npm run build

      - name: 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: ${{ inputs.worker_name || 'pansou' }}
        run: node deploy.mjs

      - name: 输出部署结果
        run: echo "✅ 部署完成，Worker = ${{ inputs.worker_name || 'pansou' }}"
